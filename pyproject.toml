[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentry-ward"
version = "0.1.0"
description = "Sentry Ward: reveal hidden hedge fund crowding from SEC Form 13F holdings."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Dulguun Enkhtsatsral" }]
classifiers = ["License :: OSI Approved :: MIT License"]
dependencies = [
    "duckdb>=1.0",
    "pandas>=2.0",
    "requests>=2.31",
    "yfinance>=0.2.50",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ward = "sentryward.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sentryward = ["*.html", "web/*.js", "web/*.css", "web/live/*", "web/live/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
